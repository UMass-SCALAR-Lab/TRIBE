model_name_or_path: meta-llama/Llama-3.2-3B-Instruct
# per_device_train_batch_size passed via CLI at launch — DPO consumes the paired dataset (one row per
# pair, no group structure), so no group_size dependency here, but batch size still affects step count.
learning_rate: 5.0e-7
lr_scheduler_type: constant
beta: 0.1
num_train_epochs: 1
gradient_checkpointing: true
bf16: true
