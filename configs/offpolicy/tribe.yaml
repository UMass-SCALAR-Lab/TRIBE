model_name_or_path: meta-llama/Llama-3.2-3B-Instruct
# group_size/per_device_train_batch_size deliberately NOT here — they depend on which dataset (GSM8K
# group_size=16 vs MATH group_size=32) this is pointed at, same convention as naive_reinforce.yaml/raft.yaml.
# MATH also needs --max_completion_length 1024 --deepspeed configs/deepspeed_zero3.json via CLI (default
# below is GSM8K's 512, no deepspeed). See slurm/run_final_3b_gsm8k_suite.sh /
# slurm/run_final_3b_math_suite.sh for the exact final launch commands (negative_fraction=0.6 confirmed
# best on a 3-seed GSM8K comparison this session).
max_completion_length: 512
lr_scheduler_type: constant
learning_rate: 1.0e-7
trust_region_eps: 0.5
divergence: chi_squared
negative_fraction: 0.6
num_train_epochs: 1
gradient_checkpointing: true
bf16: true
