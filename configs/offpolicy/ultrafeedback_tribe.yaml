model_name_or_path: meta-llama/Llama-3.2-3B-Instruct
# UltraFeedback ships exactly 4 completions/prompt (unlike GSM8K/MATH's --num_generations choice at
# data-generation time), so group_size=4 is fixed here, not passed via CLI like configs/offpolicy/tribe.yaml.
# max_completion_length=1024 (not 512): ~13.4% of UltraFeedback completions exceed 512 tokens, which would
# silently truncate the completion the reward was actually judged on for those rows. --deepspeed is
# mandatory (not optional like GSM8K's off-policy run) — plain DDP OOMs on an 80GB A100 even at
# per_device_train_batch_size=4, confirmed this session; ZeRO-3 at batch_size=16 runs cleanly.
group_size: 4
per_device_train_batch_size: 16
max_completion_length: 1024
deepspeed: configs/deepspeed_zero3.json
lr_scheduler_type: constant
learning_rate: 1.0e-7
trust_region_eps: 0.5
divergence: chi_squared
# negative_fraction swept over {0.0, 0.4, 0.6, 1.0} — 0.6 here just matches configs/offpolicy/tribe.yaml's
# own GSM8K-validated default as a starting point; this domain has never been tuned, see the sweep results
# before trusting it here.
negative_fraction: 0.6
num_train_epochs: 1
gradient_checkpointing: true
bf16: true
