model_name_or_path: meta-llama/Llama-3.2-3B-Instruct
# num_generations/per_device_train_batch_size/gradient_accumulation_steps/max_completion_length/deepspeed
# passed via CLI at launch (dataset-dependent — GSM8K uses max_completion_length=512, no deepspeed; MATH
# uses max_completion_length=1024, --deepspeed configs/deepspeed_zero3.json). See slurm/run_final_3b_gsm8k_suite.sh
# and slurm/run_final_3b_math_suite.sh for the exact final launch commands.
num_train_epochs: 1
gradient_checkpointing: true
bf16: true
learning_rate: 1.0e-6
beta: 0
trust_region_eps: 0.05
divergence: kl_new_old
negative_fraction: 1.0
negative_logp_floor: None
stage2_loss_type: grpo
scale_rewards: none
